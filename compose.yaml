name: gen-trade

services:
  postgres:
    # PostgreSQL 17, official bookworm image; pin contents as well as major version.
    image: postgres@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: gen_trade
      POSTGRES_DB: gen_trade
      # Local development only. The host port is bound to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${GEN_TRADE_PG_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen_trade -d gen_trade"]
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 5s

  redis:
    image: redis@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    ports:
      - "127.0.0.1:${GEN_TRADE_REDIS_PORT:-56379}:6379"
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 25

volumes:
  postgres-data:
