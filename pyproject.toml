[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-trade"
version = "0.1.0"
description = "Causal research implementations of two directional-change evolutionary trading methods"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14",
    "arch>=7", "deap>=1.4", "TA-Lib>=0.6", "pyarrow>=18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "maturin>=1.9"]
storage = ["psycopg[binary,pool]>=3.2", "redis>=5"]

[project.scripts]
gen-trade = "gen_trade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: opt-in local PostgreSQL and Redis checks"]
